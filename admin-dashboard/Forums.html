<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LipaAlertHub - Forums</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f2f2f2; display: flex; height: 100vh; }
    .container { display: flex; width: 100%; }
    .sidebar { width: 220px; background-color: #d53b2c; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .logo-section { text-align: center; margin-bottom: 30px; }
    .logo { width: 60px; margin-bottom: 10px; }
    .sidebar h2 { font-size: 18px; }
    .sidebar ul { list-style: none; padding: 0; width: 100%; }
    .sidebar li { padding: 12px 20px; cursor: pointer; font-weight: bold; }
    .sidebar li:hover { background-color: #b92e20; }
    .sidebar button { width: 100%; padding: 12px 20px; background-color: #d53b2c; border: none; text-align: left; color: white; cursor: pointer; font-size: 15px; font-weight: bold; transition: background 0.3s ease; }
    .sidebar button:hover { background-color: #b72c20; }
    .dashboard { flex: 1; padding: 30px; overflow-y: auto; }
    .dashboard h1 { font-size: 32px; margin-bottom: 20px; }
    .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; resize: none; min-height: 80px; margin-bottom: 10px; }
    button { background-color: #d53b2c; border: none; padding: 10px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #b92e20; }
    ul { margin-top: 15px; }
    li { margin: 10px 0; padding: 10px; background: #f8f8f8; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo-section">
        <img src="images/Logo.png" alt="Logo" class="logo" />
        <h2>LipaAlertHub</h2>
      </div>
      <nav>
        <ul>
          <li><button onclick="location.href='dashboard.html'">📊 Dashboard</button></li>
          <li><button onclick="location.href='report.html'">📄 Reports</button></li>
          <li><button onclick="location.href='announcements.html'">📢 Announcements</button></li>
          <li><button onclick="location.href='forums.html'">💬 Forums</button></li>
          <li><button onclick="location.href='maps.html'">🗺️ Map</button></li>
          <li><button onclick="location.href='chats.html'">💭 Chats</button></li>
          <li><button onclick="location.href='accounts.html'">👤 Accounts</button></li>
          <li><button onclick="location.href='analytics.html'">📈 Analytics</button></li>
          <li><button onclick="location.href='contacts.html'">📞 Contacts</button></li>
        </ul>
      </nav>
    </aside>

    <main class="dashboard">
      <h1>Community Forums</h1>
      <div class="card">
        <form id="forumForm">
          <textarea id="postText" placeholder="Write a post..." required></textarea>
          <button type="submit">Post</button>
        </form>
        <h2>Recent Discussions</h2>
        <ul id="forumList"></ul>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACw2laKXQGTW634IejVAdK8m0PKngvaRo",
      authDomain: "lipaalerthub.firebaseapp.com",
      projectId: "lipaalerthub",
      storageBucket: "lipaalerthub.firebasestorage.app",
      messagingSenderId: "991310233066",
      appId: "1:991310233066:web:7e836a60e5c4a302de0693",
      measurementId: "G-PCEYY3PFWW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("forumForm");
    const list = document.getElementById("forumList");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = document.getElementById("postText").value;
      await addDoc(collection(db, "forums"), {
        text,
        createdAt: serverTimestamp()
      });
      form.reset();
    });

    const q = query(collection(db, "forums"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      list.innerHTML = "";
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const li = document.createElement("li");
        li.textContent = `${data.text} (${data.createdAt?.toDate().toLocaleString() || "just now"})`;
        list.appendChild(li);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Report</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f2f2f2; margin: 0; display: flex; height: 100vh; }
    .container { flex: 1; padding: 40px; display: flex; justify-content: center; align-items: center; }
    .card { background: #fff; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h2 { margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; }
    button { margin-top: 20px; padding: 12px; background: #d53b2c; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:hover { background: #b92e20; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Create New Incident Report</h2>
      <form id="reportForm">
        <label>Emergency Type</label>
        <select id="emergencyType">
          <option value="Fire">🔥 Fire</option>
          <option value="Flood">🌊 Flood</option>
          <option value="Accident">🚗 Accident</option>
          <option value="Other">⚠ Other</option>
        </select>
        <label>Barangay</label>
        <input type="text" id="barangay" placeholder="Enter barangay" required />
        <label>Details</label>
        <textarea id="notes" placeholder="Describe incident..." required></textarea>
        <button type="submit">Submit Report</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACw2laKXQGTW634IejVAdK8m0PKngvaRo",
      authDomain: "lipaalerthub.firebaseapp.com",
      projectId: "lipaalerthub",
      storageBucket: "lipaalerthub.firebasestorage.app",
      messagingSenderId: "991310233066",
      appId: "1:991310233066:web:7e836a60e5c4a302de0693"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("reportForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "incident_reports"), {
          emergencyType: document.getElementById("emergencyType").value,
          barangay: document.getElementById("barangay").value,
          notes: document.getElementById("notes").value,
          status: "pending",
          createdAt: serverTimestamp()
        });
        alert("✅ Report submitted!");
        e.target.reset();
      } catch (err) {
        alert("❌ Failed: " + err.message);
      }
    });
  </script>
</body>
</html>

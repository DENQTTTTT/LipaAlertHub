<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements</title>
  <style>
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f2f2f2; display: flex; height: 100vh; }
    .container { display: flex; width: 100%; }
    .sidebar { width: 220px; background: #d53b2c; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .logo { width: 60px; margin-bottom: 10px; }
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 20px; }
    .announcement { border-bottom: 1px solid #ddd; padding: 10px 0; }
    form { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px; border: none; background: #d53b2c; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo-section">
        <img src="images/Logo.png" class="logo" />
        <h2>LipaAlertHub</h2>
      </div>
    </aside>

    <main class="main">
      <h2>📢 Announcements</h2>
      <div class="card">
        <h3>Create New Announcement</h3>
        <form id="announcementForm">
          <input type="text" id="title" placeholder="Title" required />
          <textarea id="content" placeholder="Announcement details..." required></textarea>
          <button type="submit">Post</button>
        </form>
      </div>
      <div class="card">
        <h3>Recent Announcements</h3>
        <div id="announcementsList"></div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACw2laKXQGTW634IejVAdK8m0PKngvaRo",
      authDomain: "lipaalerthub.firebaseapp.com",
      projectId: "lipaalerthub",
      storageBucket: "lipaalerthub.firebasestorage.app",
      messagingSenderId: "991310233066",
      appId: "1:991310233066:web:7e836a60e5c4a302de0693"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("announcementForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "announcements"), {
        title: document.getElementById("title").value,
        content: document.getElementById("content").value,
        createdAt: serverTimestamp()
      });
      form.reset();
    });

    const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
    const list = document.getElementById("announcementsList");
    onSnapshot(q, (snapshot) => {
      list.innerHTML = "";
      snapshot.forEach((doc) => {
        const d = doc.data();
        const div = document.createElement("div");
        div.className = "announcement";
        div.innerHTML = `<h4>${d.title}</h4><p>${d.content}</p><small>${d.createdAt?.toDate().toLocaleString() || ""}</small>`;
        list.appendChild(div);
      });
    });
  </script>
</body>
</html>

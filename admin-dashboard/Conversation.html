<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversations</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; }
    .container { display: flex; width: 100%; }
    .sidebar { width: 220px; background: #d53b2c; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .logo { width: 60px; margin-bottom: 10px; }
    .main { flex: 1; display: flex; flex-direction: column; padding: 20px; }
    .chat-box { flex: 1; border: 1px solid #ddd; padding: 15px; overflow-y: auto; background: #fff; border-radius: 12px; }
    .message { margin-bottom: 12px; padding: 10px; border-radius: 8px; max-width: 60%; }
    .admin { background: #d53b2c; color: white; margin-left: auto; }
    .user { background: #f1f1f1; color: black; }
    form { margin-top: 10px; display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 10px 15px; background: #d53b2c; color: white; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo-section">
        <img src="images/Logo.png" class="logo" />
        <h2>LipaAlertHub</h2>
      </div>
    </aside>

    <main class="main">
      <h2>💬 Conversations</h2>
      <div class="chat-box" id="chatBox"></div>
      <form id="chatForm">
        <input type="text" id="chatInput" placeholder="Type a message..." required />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACw2laKXQGTW634IejVAdK8m0PKngvaRo",
      authDomain: "lipaalerthub.firebaseapp.com",
      projectId: "lipaalerthub",
      storageBucket: "lipaalerthub.firebasestorage.app",
      messagingSenderId: "991310233066",
      appId: "1:991310233066:web:7e836a60e5c4a302de0693"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const chatBox = document.getElementById("chatBox");
    const q = query(collection(db, "chats"), orderBy("createdAt"));

    onSnapshot(q, (snapshot) => {
      chatBox.innerHTML = "";
      snapshot.forEach((doc) => {
        const d = doc.data();
        const div = document.createElement("div");
        div.className = "message " + (d.sender === "admin" ? "admin" : "user");
        div.textContent = d.text;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    document.getElementById("chatForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("chatInput").value;
      await addDoc(collection(db, "chats"), { sender: "admin", text: msg, createdAt: serverTimestamp() });
      e.target.reset();
    });
  </script>
</body>
</html>

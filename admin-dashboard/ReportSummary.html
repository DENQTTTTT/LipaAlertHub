<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Summary</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f2f2f2; display: flex; height: 100vh; }
    .container { display: flex; width: 100%; }
    .sidebar { width: 220px; background: #d53b2c; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .logo { width: 60px; margin-bottom: 10px; }
    .main { flex: 1; padding: 30px; overflow-y: auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.1); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #d53b2c; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo-section">
        <img src="images/Logo.png" class="logo" />
        <h2>LipaAlertHub</h2>
      </div>
      <nav>
        <ul>
          <li><button onclick="location.href='dashboard.html'">📊 Dashboard</button></li>
          <li><button onclick="location.href='reportsummary.html'">📑 Report Summary</button></li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <div class="card">
        <h2>Summary of Reports</h2>
        <table>
          <thead>
            <tr><th>Type</th><th>Total</th></tr>
          </thead>
          <tbody id="summaryTable"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACw2laKXQGTW634IejVAdK8m0PKngvaRo",
      authDomain: "lipaalerthub.firebaseapp.com",
      projectId: "lipaalerthub",
      storageBucket: "lipaalerthub.firebasestorage.app",
      messagingSenderId: "991310233066",
      appId: "1:991310233066:web:7e836a60e5c4a302de0693"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const counts = {};
    const querySnapshot = await getDocs(collection(db, "incident_reports"));
    querySnapshot.forEach((doc) => {
      const d = doc.data();
      counts[d.emergencyType] = (counts[d.emergencyType] || 0) + 1;
    });

    const table = document.getElementById("summaryTable");
    for (let type in counts) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${type}</td><td>${counts[type]}</td>`;
      table.appendChild(tr);
    }
  </script>
</body>
</html>
